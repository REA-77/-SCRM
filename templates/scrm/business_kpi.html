{% extends "scrm/base.html" %}
{% block title %}商务KPI{% endblock %}
{% block content %}
<div class="page-head"><div><h2>📊 商务KPI</h2><div class="sub">按月份查看商务已成交金额、目标完成进度和待成交金额</div></div><div class="toolbar"><label class="muted">统计月份 <input id="month" type="month" style="width:150px"></label><button class="btn primary" id="refresh">刷新</button></div></div>
<div class="grid cards-4 business-kpi-summary" id="summary"><div class="card stat-card kpi-primary"><div class="kpi-label">总KPI <span class="kpi-ico">🎯</span></div><div class="kpi-value">—</div><div class="kpi-foot">本月商务目标</div></div><div class="card stat-card kpi-green"><div class="kpi-label">已完成KPI <span class="kpi-ico">✅</span></div><div class="kpi-value">—</div><div class="kpi-foot">本月已成交金额</div></div><div class="card stat-card kpi-teal"><div class="kpi-label">完成进度 <span class="kpi-ico">📈</span></div><div class="kpi-value">—</div><div class="kpi-foot">已完成 ÷ 总KPI</div></div><div class="card stat-card kpi-amber"><div class="kpi-label">待成交金额 <span class="kpi-ico">⏳</span></div><div class="kpi-value">—</div><div class="kpi-foot">本月询单 + 二询</div></div></div>
<div class="card" style="padding:0"><div class="table-wrap"><table class="data"><thead><tr><th>商务组员</th><th>月KPI</th><th>已成交金额</th><th>已完成进度</th><th>待成交金额</th></tr></thead><tbody id="body"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody></table></div></div>
{% endblock %}
{% block scripts %}
<script>
const esc=S.esc, money=v=>`¥${Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const monthEl=S.$("month"); monthEl.value=new Date().toISOString().slice(0,7);
function progress(v){const n=Math.max(0,Number(v||0));return `<div style="min-width:140px"><div style="display:flex;justify-content:space-between"><span>${n.toFixed(2)}%</span><span class="muted">${n>=100?'已达标':''}</span></div><div style="height:7px;background:var(--border);border-radius:8px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(n,100)}%;background:${n>=100?'#16a34a':'#4f46e5'}"></i></div></div>`}
async function load(){const d=await S.api(`/business-kpi?month=${encodeURIComponent(monthEl.value)}`),s=d.summary||{};S.$("summary").innerHTML=`<div class="card stat-card kpi-primary"><div class="kpi-label">总KPI <span class="kpi-ico">🎯</span></div><div class="kpi-value">${money(s.target)}</div><div class="kpi-foot">本月商务目标</div></div><div class="card stat-card kpi-green"><div class="kpi-label">已完成KPI <span class="kpi-ico">✅</span></div><div class="kpi-value">${money(s.completed)}</div><div class="kpi-foot">本月已成交金额</div></div><div class="card stat-card kpi-teal"><div class="kpi-label">完成进度 <span class="kpi-ico">📈</span></div><div class="kpi-value">${Number(s.progress||0).toFixed(2)}%</div><div class="kpi-foot">已完成 ÷ 总KPI</div></div><div class="card stat-card kpi-amber"><div class="kpi-label">待成交金额 <span class="kpi-ico">⏳</span></div><div class="kpi-value">${money(s.pending)}</div><div class="kpi-foot">本月询单 + 二询</div></div>`;S.$("body").innerHTML=(d.rows||[]).map(r=>`<tr><td><strong>${esc(r.member)}</strong></td><td class="mono">${money(r.target)}</td><td class="mono">${money(r.completed)}</td><td>${progress(r.progress)}</td><td class="mono">${money(r.pending)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">暂无商务组员数据</td></tr>';}
S.$("refresh").onclick=load;monthEl.onchange=load;load();
</script>
{% endblock %}
