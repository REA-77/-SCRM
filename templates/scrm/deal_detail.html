{% extends "scrm/base.html" %}
{% block title %}商单详情{% endblock %}
{% block content %}
<style>
/* 商单详情：将状态、关键指标和执行内容拆开，让重要信息先被看见。 */
.deal-page-head{margin-bottom:18px}.deal-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:600}.deal-back:hover{color:var(--primary);text-decoration:none}.deal-page-head h2{margin:8px 0 0;font-size:24px;letter-spacing:-.025em}.deal-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:28px;margin-bottom:14px;padding:22px 24px;border:1px solid rgba(40,122,73,.17);border-radius:16px;background:linear-gradient(115deg,#fff 0%,#f4faf5 58%,#edf8ef 100%);box-shadow:0 10px 28px rgba(32,92,51,.08)}.deal-hero::after{content:"";position:absolute;right:-80px;top:-100px;width:270px;height:270px;border-radius:50%;background:radial-gradient(circle,rgba(102,187,135,.14),transparent 67%);pointer-events:none}.deal-hero-main{position:relative;z-index:1;min-width:0}.deal-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:#64748b;font-size:12px;font-weight:650;letter-spacing:.06em}.deal-eyebrow i{width:7px;height:7px;border-radius:50%;background:#5c9e69;box-shadow:0 0 0 4px rgba(92,158,105,.12)}.deal-hero-name{font-size:23px;font-weight:750;letter-spacing:-.025em;word-break:break-word}.deal-meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:12px;color:var(--text-2);font-size:12.5px}.deal-meta span{display:inline-flex;align-items:center;gap:5px}.deal-meta b{color:var(--text);font-weight:600}.deal-progress{position:relative;z-index:1;display:flex;align-items:center;gap:0;flex-shrink:0;padding:5px 0}.deal-step{position:relative;display:grid;justify-items:center;gap:6px;min-width:74px;color:#9ca3af;font-size:11px;text-align:center}.deal-step:not(:last-child)::after{content:"";position:absolute;left:calc(50% + 15px);top:15px;width:calc(100% - 30px);height:1px;background:#dce2e9}.deal-step i{display:grid;place-items:center;width:30px;height:30px;border:1px solid #dce2e9;border-radius:50%;background:#fff;color:#9ca3af;font-style:normal;font-size:13px}.deal-step.done,.deal-step.active{color:#426f4e;font-weight:650}.deal-step.done i{border-color:#6dae7a;background:#eaf7ec;color:#347442}.deal-step.active i{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(40,122,73,.24)}.deal-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.deal-kpi{min-height:105px;padding:16px 17px;border:1px solid var(--border);border-radius:13px;background:#fff;box-shadow:var(--shadow)}.deal-kpi-label{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:12px}.deal-kpi-label i{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#eaf6ed;color:var(--primary);font-size:14px;font-style:normal}.deal-kpi:nth-child(2) .deal-kpi-label i{background:#eefaf5;color:#17875c}.deal-kpi:nth-child(3) .deal-kpi-label i{background:#fff7e9;color:#c98319}.deal-kpi:nth-child(4) .deal-kpi-label i{background:#f4f5f7;color:#667085}.deal-kpi-value{margin-top:9px;font-size:23px;font-weight:750;letter-spacing:-.025em}.deal-kpi-foot{margin-top:3px;color:var(--text-3);font-size:11.5px}.deal-detail-grid{grid-template-columns:minmax(300px,.78fr) minmax(680px,1.92fr)!important;align-items:start}.deal-detail-grid .card{border-radius:13px}.deal-detail-grid .card-title{padding-bottom:11px;border-bottom:1px solid #eef0f3}.deal-detail-grid .kvlist{grid-template-columns:88px 1fr;gap:10px 12px}.deal-detail-grid .kvlist .k{font-size:12px;color:#8a919e}.deal-detail-grid .kvlist .v{font-size:13px;line-height:1.55}.deal-detail-grid .table-wrap{margin:-2px -2px}.deal-detail-grid table.data{font-size:12.5px}.deal-detail-grid table.data th{background:#f6fbf7}.deal-detail-grid table.data td{padding-top:11px;padding-bottom:11px}.deal-empty{padding:38px 20px!important}.deal-empty .big{font-size:30px!important}@media(max-width:1180px){.deal-hero{align-items:flex-start;flex-direction:column}.deal-progress{width:100%;justify-content:flex-start}.deal-kpis{grid-template-columns:repeat(2,1fr)}.deal-detail-grid{grid-template-columns:1fr!important}}@media(max-width:640px){.deal-page-head h2{font-size:21px}.deal-hero{padding:19px}.deal-hero-name{font-size:20px}.deal-progress{overflow-x:auto;padding-bottom:3px}.deal-step{min-width:68px}.deal-kpis{grid-template-columns:1fr 1fr;gap:9px}.deal-kpi{min-height:96px;padding:13px}.deal-kpi-value{font-size:20px}.deal-detail-grid .kvlist{grid-template-columns:78px 1fr}}
</style>
<div class="page-head">
  <div class="deal-page-head">
    <a class="deal-back" href="/scrm/deals">← 返回商单列表</a>
    <h2>商单详情</h2>
    <div class="sub" id="subTitle">正在加载商单信息…</div>
  </div>
  <div class="actions">
    <button class="btn" id="addAccountDealBtn">➕ 新增账户商单</button>
    <button class="btn primary" id="addVideoBtn">➕ 添加展示视频</button>
    <button class="btn danger" id="deleteDealBtn">删除商单</button>
  </div>
</div>

<div id="root"><div class="loading"><span class="spin"></span> 加载中…</div></div>
{% endblock %}

{% block scripts %}
<script>
const DID = {{ did | tojson }};
const STATUS_TEXT = { executing: "执行中", published: "已发布", won: "合作成功", kpi_done: "KPI已完成", ended: "已结束", canceled: "已取消" };
const STATUS_COLOR = { executing: "primary", published: "teal", won: "green", kpi_done: "green", ended: "gray", canceled: "red" };
let data = null;
let autoEditOpened = false;
function dateInputValue(ts) { if (!ts) return ""; const d = new Date(Number(ts) * 1000); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function dateOnly(ts) { if (!ts) return ""; const d = new Date(Number(ts) * 1000); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

function sellingPointTemplateModal() {
  const modal = S.modal({ title: "卖点模板", wide: true, body: `<div class="loading"><span class="spin"></span> 正在加载品类痛点…</div>`, okText: "保存并同步商品匹配", onOk: async body => {
    const rows = [...body.querySelectorAll("[data-pain-id]")].map(el => ({
      pain_point_id: el.dataset.painId,
      star_rating: Number(el.querySelector("[data-stars]").value),
      reply_guidance: el.querySelector("[data-guidance]").value.trim(),
    }));
    const result = await S.api(`/deals/${DID}/selling-point-templates`, {method:"POST", body:{rows}});
    S.toast(`已保存，并同步 ${result.synced_count} 条商品痛点匹配`, "ok");
  }});
  S.api(`/deals/${DID}/selling-point-templates`).then(t => {
    if (!t.category) {
      modal.bodyEl.innerHTML = `<div class="empty"><div class="big">🏷️</div>请先编辑商单并填写品类，再配置卖点模板</div>`;
      return;
    }
    if (!t.rows.length) {
      modal.bodyEl.innerHTML = `<div class="empty"><div class="big">💡</div>「${S.esc(t.category)}」暂无痛点，请先在知识库的产品类目痛点表中维护</div>`;
      return;
    }
    modal.bodyEl.innerHTML = `<div class="sub" style="margin-bottom:10px">展示「${S.esc(t.category)}」全部痛点。保存后会同步到当前商品（${S.esc(t.model_id)}）的痛点匹配表。</div>
      <div class="table-wrap"><table class="data"><thead><tr><th style="min-width:150px">痛点</th><th style="width:95px">品类</th><th style="width:115px">星级</th><th style="min-width:280px">标准回复</th></tr></thead><tbody>
      ${t.rows.map(r => `<tr data-pain-id="${S.esc(r.pain_point_id)}"><td><b>${S.esc(r.pain_point)}</b>${r.state !== "usable" ? `<div class="sub2">${S.esc(r.state)}</div>` : ""}</td><td>${S.esc(r.category)}</td><td><select data-stars>${[1,2,3,4,5].map(n => `<option value="${n}" ${Number(r.star_rating || 3) === n ? "selected" : ""}>${"★".repeat(n)}${"☆".repeat(5-n)}</option>`).join("")}</select></td><td><textarea data-guidance rows="3" placeholder="填写面向用户的标准回复">${S.esc(r.reply_guidance || "")}</textarea></td></tr>`).join("")}
      </tbody></table></div>`;
  }).catch(e => { modal.bodyEl.innerHTML = `<div class="err-banner">加载失败：${S.esc(e.message)}</div>`; });
}

function videoModal(row = null) {
  const accounts = (data.deal.platform_accounts || "").split(",").map(s => s.trim()).filter(Boolean);
  const hasRecordId = !!(row && (row.id ?? row.video_id));
  const editing = !!row;
  const modal = S.modal({
    title: editing ? "编辑展示视频" : "添加平台账户展示视频",
    body: `
      <div class="form-row"><label>发布平台</label>
        <select id="vPlat">
          <option value="">选择平台</option>
          <option ${(!row || !row.platform || row.platform === "B站") ? "selected" : ""}>B站</option><option ${row?.platform === "抖音" ? "selected" : ""}>抖音</option><option ${row?.platform === "视频号" ? "selected" : ""}>视频号</option><option ${row?.platform === "小红书" ? "selected" : ""}>小红书</option>
          <option ${row?.platform === "快手" ? "selected" : ""}>快手</option><option ${row?.platform === "微博" ? "selected" : ""}>微博</option><option ${row?.platform === "知乎" ? "selected" : ""}>知乎</option>
        </select></div>
      <div class="form-row"><label>平台账户</label>
        <input id="vAccount" list="accountList" value="${S.esc(row?.account || "")}" placeholder="选择或输入账户名">
        <datalist id="accountList">${accounts.map(a => `<option value="${S.esc(a)}">`).join("")}</datalist></div>
      <div class="form-row"><label>视频金额</label><input id="vAmount" type="number" step="0.01" value="${S.esc(row?.amount ?? data.deal.amount ?? "")}" placeholder="选填"></div>
      <div class="form-row"><label>发布时间</label><input id="vPublish" type="datetime-local" value="${dateInputValue(row?.publish_ts)}"></div>
      <div class="form-row"><label>视频链接（选填）</label><input id="vUrl" value="${S.esc(row?.url || "")}" placeholder="可稍后补充 https://..."></div>`,
    okText: "保存",
    onOk: async (body) => {
      const url = body.querySelector("#vUrl").value.trim();
      const publish = body.querySelector("#vPublish").value;
      const payload = { platform: body.querySelector("#vPlat").value, account: body.querySelector("#vAccount").value.trim(), amount: body.querySelector("#vAmount").value || null, publish_ts: publish ? Math.floor(new Date(publish).getTime() / 1000) : null, url };
      const updatePayload = {...payload, id: row?.id ?? row?.video_id ?? null, video_id: row?.id ?? row?.video_id ?? null, deal_id: DID, old_url: row?.url || ""};
      await S.api(hasRecordId ? "/deals/video/update" : `/deals/${DID}/video`, { method: "POST", body: hasRecordId ? updatePayload : payload });
      S.toast(editing ? "视频已保存" : "视频链接已添加", "ok");
      load();
    },
  });
}

function addAccountDealsModal() {
  let rows = [{platform:"", account:""}];
  const platforms = ["B站","抖音","视频号","小红书","快手","微博","知乎"];
  const syncRows = body => rows = rows.map((r,i)=>({platform:body.querySelector(`[data-p="${i}"]`)?.value || r.platform, account:body.querySelector(`[data-a="${i}"]`)?.value.trim() || r.account}));
  const renderRows = body => { body.querySelector("#accountRows").innerHTML = rows.map((r,i) => `<div class="form-row" style="display:flex;gap:8px;align-items:center"><select data-p="${i}" style="flex:1"><option value="">选择平台</option>${platforms.map(p=>`<option ${p===r.platform?"selected":""}>${p}</option>`).join("")}</select><input data-a="${i}" value="${S.esc(r.account)}" placeholder="平台账户" style="flex:2"><button class="btn sm danger" data-del="${i}">删除</button></div>`).join(""); };
  const modal = S.modal({title:"新增账户商单", wide:true, body:`<div class="sub" style="margin-bottom:10px">每个账户将创建一条新的商单，名称为“原询单名称-账户名称”。</div><div id="accountRows"></div><button class="btn sm" id="addAccountRow">➕ 添加平台账户</button>`, okText:"创建商单", onOk: async body => {
    rows = rows.map((r,i)=>({platform:body.querySelector(`[data-p="${i}"]`).value,account:body.querySelector(`[data-a="${i}"]`).value.trim()})).filter(r=>r.platform&&r.account);
    if(!rows.length){S.toast("请至少填写一个平台账户","err");return false;}
    await S.api(`/deals/${DID}/accounts`,{method:"POST",body:{accounts:rows}}); S.toast("账户商单已创建","ok"); void load();
  }});
  renderRows(modal.bodyEl);
  modal.bodyEl.querySelector("#addAccountRow").onclick=()=>{syncRows(modal.bodyEl);rows.push({platform:"",account:""});renderRows(modal.bodyEl);bind();};
  function bind(){modal.bodyEl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{syncRows(modal.bodyEl);rows.splice(Number(b.dataset.del),1);if(!rows.length)rows.push({platform:"",account:""});renderRows(modal.bodyEl);bind();});}
  bind();
}

function statusModal() {
  const modal = S.modal({
    title: "更新商单状态",
    body: `
      <div class="form-row"><label>状态</label>
        <select id="dStatus">${Object.entries(STATUS_TEXT).map(([k, v]) =>
          `<option value="${k}" ${data.deal.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="form-row"><label>商单名称</label><input id="dName" value="${S.esc(data.deal.name || "")}"></div>
      <div class="form-row"><label>品牌</label><input id="dBrand" value="${S.esc(data.deal.brand || "")}" placeholder="支持逗号、顿号、斜杠、分号或空格分隔"></div>
      <div class="form-row"><label>产品</label><input id="dProduct" value="${S.esc(data.deal.product || "")}"></div>
      <div class="form-row"><label>型号</label><input id="dModel" value="${S.esc(data.deal.model || "")}" placeholder="请输入产品型号"></div>
      <div class="form-row"><label>媒介公司</label><input id="dMedia" value="${S.esc(data.deal.media_company || "")}"></div>
      <div class="form-row"><label>商务负责人</label><input id="dOwner" value="${S.esc(data.deal.owner || "")}"></div>
      <div class="form-row"><label>合作类型</label><input id="dCoop" value="${S.esc(data.deal.coop_types || "")}"></div>
      <div class="form-row"><label>平台账号</label><input id="dAccounts" value="${S.esc(data.deal.platform_accounts || "")}"></div>
      <div class="form-row"><label>备注</label>
        <textarea id="dNote">${S.esc(data.deal.note || "")}</textarea></div>
      <div class="form-row"><label>订单编号</label><input id="dOrderNo" value="${S.esc(data.deal.order_no || "")}"></div>
      <div class="form-row"><label>品类（一级分类）</label><select id="dCategory"><option value="">请选择一级分类</option>${(data.categories || []).map(c => `<option value="${S.esc(c.name)}" ${data.deal.category === c.name ? "selected" : ""}>${S.esc(c.name)}</option>`).join("")}</select></div>
      <div class="form-row"><label>返点</label><input id="dRebate" type="number" step="0.01" value="${S.esc(data.deal.rebate ?? "")}"></div>
      <div class="form-row"><label>预计发布时间</label><input id="dExpectTs" type="date" value="${dateOnly(data.deal.expect_ts)}"></div>
      <div class="form-row"><label>实际发布时间</label><input id="dActualPublishDate" type="date" value="${S.esc(data.deal.actual_publish_date || "")}" placeholder="YYYY-MM-DD"></div>`,
    okText: "保存",
    onOk: async (body) => {
      const saved = await S.api(`/deals/${DID}/update`, { method: "POST", body: {
        status: body.querySelector("#dStatus").value,
        name: body.querySelector("#dName").value.trim(), brand: body.querySelector("#dBrand").value.trim(),
        product: body.querySelector("#dProduct").value.trim(), model: body.querySelector("#dModel").value.trim(), media_company: body.querySelector("#dMedia").value.trim(),
        owner: body.querySelector("#dOwner").value.trim(), coop_types: body.querySelector("#dCoop").value.trim(),
        platform_accounts: body.querySelector("#dAccounts").value.trim(),
        note: body.querySelector("#dNote").value,
        order_no: body.querySelector("#dOrderNo").value.trim(),
        category: body.querySelector("#dCategory").value.trim(),
        rebate: body.querySelector("#dRebate").value || null,
        expect_ts: body.querySelector("#dExpectTs").value ? Math.floor(new Date(body.querySelector("#dExpectTs").value + "T00:00:00").getTime() / 1000) : null,
        actual_publish_date: body.querySelector("#dActualPublishDate").value || null,
      }});
      S.toast(saved.synced_videos ? `已保存，自动匹配 ${saved.synced_videos} 个视频链接` : "已保存，未找到符合日期的平台视频", saved.synced_videos ? "ok" : "warn");
      // 保存成功后立即关闭弹窗，详情数据在后台刷新，避免等待列表重绘阻塞关闭。
      void load();
    },
  });
}

function render() {
  const d = data.deal;
  const videos = data.videos || [];
  const publishedVideos = videos.filter(v => v.url).length;
  const completedVideos = videos.filter(v => v.video_status === "已达标").length;
  const amount = videos.reduce((total, v) => total + (Number(v.amount) || 0), 0) || (Number(d.amount) || 0);
  const stages = ["executing", "published", "won", "kpi_done", "ended"];
  const currentStage = Math.max(0, stages.indexOf(d.status));
  const stageLabels = ["执行中", "已发布", "合作成功", "KPI完成", "已结束"];
  S.$("subTitle").textContent = d.name || "-";
  document.title = `${d.name || "商单详情"} · 觅牛文化`;
  S.$("root").innerHTML = `
    <section class="deal-hero">
      <div class="deal-hero-main">
        <div class="deal-eyebrow"><i></i>DEAL OVERVIEW · ${S.esc(d.order_no || "未填写订单编号")}</div>
        <div class="deal-hero-name">${S.esc(d.name || "未命名商单")}</div>
        <div class="deal-meta"><span>品牌 <b>${S.esc(d.brand || "待补充")}</b></span><span>产品 <b>${S.esc(d.product || "待补充")}</b></span><span>负责人 <b>${S.esc(d.owner || "未分配")}</b></span><span>${S.badge(d.display_status || STATUS_TEXT[d.status] || d.status, d.data_completed ? "green" : (STATUS_COLOR[d.status] || "gray"), true)}</span></div>
      </div>
      <div class="deal-progress" aria-label="商单进度">${stageLabels.map((label, i) => `<div class="deal-step ${i < currentStage ? "done" : (i === currentStage ? "active" : "")}"><i>${i < currentStage ? "✓" : i + 1}</i><span>${label}</span></div>`).join("")}</div>
    </section>
    <section class="deal-kpis" aria-label="商单关键数据">
      <div class="deal-kpi"><div class="deal-kpi-label">关联展示视频<i>◉</i></div><div class="deal-kpi-value">${videos.length}</div><div class="deal-kpi-foot">已发布 ${publishedVideos} 条</div></div>
      <div class="deal-kpi"><div class="deal-kpi-label">KPI 达标进度<i>✓</i></div><div class="deal-kpi-value">${completedVideos}/${videos.length}</div><div class="deal-kpi-foot">${videos.length ? Math.round(completedVideos / videos.length * 100) : 0}% 视频已达标</div></div>
      <div class="deal-kpi"><div class="deal-kpi-label">商单金额<i>¥</i></div><div class="deal-kpi-value">${amount ? `¥${amount.toLocaleString("zh-CN", {maximumFractionDigits: 2})}` : "待填写"}</div><div class="deal-kpi-foot">${d.rebate != null && d.rebate !== "" ? `返点 ${S.esc(d.rebate)}` : "暂未设置返点"}</div></div>
      <div class="deal-kpi"><div class="deal-kpi-label">预计发布<i>◷</i></div><div class="deal-kpi-value">${d.actual_publish_date || (d.display_expect_ts ? dateOnly(d.display_expect_ts) : (d.expect_ts ? dateOnly(d.expect_ts) : "待排期"))}</div><div class="deal-kpi-foot">${d.actual_publish_date ? "实际发布时间" : "计划 / 最近发布时间"}</div></div>
    </section>
    <div class="grid cards-2 deal-detail-grid">
      <div>
        <div class="card">
          <div class="card-title">商单信息
            <span class="more">${S.badge(d.display_status || STATUS_TEXT[d.status] || d.status, d.data_completed ? "green" : (STATUS_COLOR[d.status] || "gray"), true)} <button class="btn sm" id="editDealBtn">编辑</button></span>
          </div>
          <div class="kvlist">
            <div class="k">商单名称</div><div class="v">${S.esc(d.name || "-")}</div>
            <div class="k">订单编号</div><div class="v mono">${S.esc(d.order_no || "-")}</div>
            <div class="k">品牌 / 产品</div><div class="v">${S.esc(d.brand || "-")} / ${S.esc(d.product || "-")}</div>
            <div class="k">型号</div><div class="v">${S.esc(d.model || "-")}</div>
            <div class="k">品类</div><div class="v">${S.esc(d.category || "-")}</div>
            <div class="k">返点</div><div class="v">${S.esc(d.rebate ?? "-")}</div>
            <div class="k">商单状态</div><div class="v">${S.badge(d.display_status || STATUS_TEXT[d.status] || d.status, d.data_completed ? "green" : (STATUS_COLOR[d.status] || "gray"), true)}</div>
            <div class="k">完成时间</div><div class="v">${S.fmtTs(d.completed_ts)}</div>
            <div class="k">媒介公司</div><div class="v">${S.esc(d.media_company || "-")}</div>
            <div class="k">商务负责人</div><div class="v">${S.esc(d.owner || "-")}</div>
            <div class="k">合作类型</div><div class="v">${S.esc(d.coop_types || "-")}</div>
            <div class="k">平台账号</div><div class="v">${S.esc(d.platform_accounts || "-")}</div>
            <div class="k">排期</div><div class="v">${d.expect_ts ? dateOnly(d.expect_ts) : "-"}</div>
            <div class="k">实际发布</div><div class="v">${S.esc(d.actual_publish_date || (d.display_expect_ts ? dateOnly(d.display_expect_ts) : "—"))}</div>
            <div class="k">备注</div><div class="v">${S.esc(d.note || "—")}</div>
            <div class="k">创建时间</div><div class="v">${S.fmtTs(d.created_ts)}</div>
          </div>
        </div>
        ${data.inquiry ? `
        <div class="card">
          <div class="card-title">来源询单
            <span class="more"><a class="btn sm ghost" href="/scrm/inquiries">查看询单 →</a></span>
          </div>
          <div class="kvlist">
            <div class="k">询单编号</div><div class="v mono">#${S.esc(data.inquiry.inquiry_no || "-")}</div>
            <div class="k">合作状态</div><div class="v">${S.badge(data.inquiry.status, data.inquiry.status === "合作成功" ? "green" : "gray", true)}</div>
            <div class="k">联系人</div><div class="v">${S.esc(data.inquiry.contact || "-")}</div>
            <div class="k">微信</div><div class="v">${S.esc(data.inquiry.wechat || "-")}</div>
            <div class="k">跟进详情</div><div class="v">${S.esc(data.inquiry.follow_detail || "—")}</div>
          </div>
        </div>` : ""}
      </div>

      <div>
        <div class="card">
          <div class="card-title">📺 展示视频(${data.videos.length})
            <span class="more"><button class="btn sm" id="sellingPointBtn">💡 卖点模板</button> <button class="btn sm" id="addVideoBtn2">➕ 添加</button></span>
          </div>
          ${data.videos.length ? `<div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th style="width:64px;">平台</th><th style="width:150px;">账户</th><th style="width:90px;">金额</th><th style="width:110px;">KPI播放</th><th style="width:110px;">KPI互动</th><th style="min-width:180px;">视频标题</th><th style="width:130px;">发布时间</th><th style="width:82px;">视频状态</th><th style="width:110px;">操作</th>
              </tr></thead>
              <tbody>${data.videos.map(v => `<tr>
                <td>${v.platform ? S.platformTag(v.platform) : '<span class="muted">—</span>'}</td>
                <td>
                  <div class="clamp">👤 ${S.esc(v.account || "-")}</div>
                  <div class="sub2">${S.badge(v.category || "原创", v.category === "商单" ? "amber" : "gray")}</div>
                </td>
                <td class="mono">${v.amount == null ? "—" : S.esc(v.amount)}</td>
                <td class="mono" style="${v.play_reached ? "color:#16a34a;font-weight:600;" : ""}">${v.kpi_views == null ? "—" : S.esc(v.kpi_views)}<div class="sub2" style="${v.play_reached ? "color:#16a34a;" : ""}">实际 ${v.actual_views == null ? "—" : S.esc(v.actual_views)}</div></td>
                <td class="mono" style="${v.interaction_reached ? "color:#16a34a;font-weight:600;" : ""}">${v.kpi_interactions == null ? "—" : S.esc(v.kpi_interactions)}<div class="sub2" style="${v.interaction_reached ? "color:#16a34a;" : ""}">实际 ${v.actual_interactions == null ? "—" : S.esc(v.actual_interactions)}</div></td>
                <td>${v.url ? `<a href="${S.esc(v.url)}" target="_blank" class="clamp">${S.esc(v.title || "打开视频")}</a>` : `<span class="muted">${S.esc(v.title || "待补充标题")}</span>`}</td>
                <td class="nowrap muted">${S.fmtTs(v.publish_ts)}</td>
                <td>${S.badge(v.video_status || "未达标", v.video_status === "已达标" ? "green" : "gray", true)}</td>
                <td><button class="btn sm" data-edit-vid="${v.id ?? v.video_id ?? ''}">编辑</button> <button class="btn sm danger" data-vid="${v.id ?? v.video_id ?? ''}">删除</button></td>
              </tr>`).join("")}</tbody>
            </table>
          </div>` : `<div class="empty deal-empty"><div class="big">📺</div>暂无展示视频，点击「添加展示视频」补充平台账户对应的视频链接</div>`}
        </div>
        <div class="card">
          <div class="card-title">💡 卖点模板
            <span class="more"><button class="btn sm" id="sellingPointBtn2">编辑并同步商品匹配</button></span>
          </div>
          ${data.deal.category ? (data.selling_point_templates || []).length ? `<div class="table-wrap"><table class="data"><thead><tr><th style="min-width:150px">痛点</th><th style="width:95px">品类</th><th style="width:80px">星级</th><th style="min-width:260px">标准回复</th></tr></thead><tbody>${data.selling_point_templates.map(p => `<tr><td>${S.esc(p.pain_point)}</td><td>${S.esc(p.category)}</td><td title="${S.esc(p.star_rating || 3)} 星" style="color:#f59e0b;white-space:nowrap">${"★".repeat(Number(p.star_rating || 3))}${"☆".repeat(5-Number(p.star_rating || 3))}</td><td style="white-space:pre-wrap">${S.esc(p.reply_guidance || "—")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><div class="big">💡</div>「${S.esc(data.deal.category)}」暂无痛点，请先在知识库中维护</div>` : `<div class="empty"><div class="big">🏷️</div>请先编辑商单并填写品类</div>`}
        </div>
        <div class="card">
          <div class="card-title">🚀 品牌原创视频 (${(data.historical_original_videos || []).length})</div>
          ${(data.historical_original_videos || []).length ? `<div class="table-wrap"><table class="data"><thead><tr><th style="width:70px">平台</th><th style="width:120px">作者</th><th style="width:130px">产品名称</th><th>视频标题</th><th style="width:100px">播放</th><th style="width:130px">发布时间</th></tr></thead><tbody>
            ${data.historical_original_videos.map(v => `<tr><td>${S.platformTag(v.platform)}</td><td class="clamp">${S.esc(v.upname || "—")}</td><td class="clamp">${S.esc(v.product_name || "—")}</td><td>${v.url ? `<a href="${S.esc(v.url)}" target="_blank" class="clamp">${S.esc(v.title || "打开视频")}</a>` : `<span class="clamp">${S.esc(v.title || "—")}</span>`}</td><td class="mono">${S.esc(v.view_count || "—")}</td><td class="nowrap muted">${S.fmtTs(v.publish_time)}</td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty"><div class="big">🚀</div>${d.brand ? "暂无已审核通过的同品牌原创视频" : "请先在商单信息中填写品牌"}</div>`}
        </div>
      </div>
    </div>`;
  S.$("editDealBtn").onclick = statusModal;
  S.$("deleteDealBtn").onclick = () => S.confirm("确认删除该商单及其展示视频吗？删除后无法恢复。", async () => {
    await S.api(`/deals/${DID}/delete`, { method: "POST" });
    S.toast("商单已删除", "ok");
    location.href = "/scrm/deals";
  });
  S.$("addVideoBtn2").onclick = videoModal;
  S.$("sellingPointBtn").onclick = sellingPointTemplateModal;
  S.$("sellingPointBtn2").onclick = sellingPointTemplateModal;
  S.$$('[data-edit-vid]').forEach(b => b.onclick = () => {
    const row = data.videos.find(v => Number(v.id) === Number(b.dataset.editVid));
    if (row) videoModal(row);
  });
  S.$$(".btn.danger[data-vid]").forEach(b => b.onclick = () =>
    S.confirm("确认删除该视频链接?", async () => {
      await S.api("/deals/video/delete", { method: "POST", body: { id: Number(b.dataset.vid) } });
      S.toast("已删除", "ok"); load();
    }));
}

S.$("addVideoBtn").onclick = videoModal;
S.$("addAccountDealBtn").onclick = addAccountDealsModal;
async function load() {
  try {
    data = await S.api(`/deals/${DID}`);
    render();
    if (!autoEditOpened && new URLSearchParams(location.search).get("edit") === "1") {
      autoEditOpened = true;
      history.replaceState({}, document.title, location.pathname);
      statusModal();
    }
  } catch (e) {
    S.$("root").innerHTML = `<div class="err-banner">加载失败:${S.esc(e.message)}</div>`;
  }
}

load();
</script>
{% endblock %}
