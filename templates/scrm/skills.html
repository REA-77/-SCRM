{% extends "scrm/base.html" %}
{% block title %}人设 Skill 管理{% endblock %}
{% block content %}
<div class="page-head"><div><h2>🎭 人设 Skill 管理</h2><div class="sub">仅维护人设参数包；请前往 UP主管理页绑定已有 Skill。</div></div><div class="actions"><button class="btn primary" id="newBtn">➕ 新建 Skill</button></div></div>
<div id="grid" class="entity-grid"><div class="loading"><span class="spin"></span> 加载中…</div></div>
{% endblock %}
{% block scripts %}
<script>
let rows=[];
function parsePersona(v){try{return typeof v==="string"?JSON.parse(v):(v||{});}catch(_){return {};}}
function splitList(v){return String(v||"").split(/[，,\n]/).map(x=>x.trim()).filter(Boolean);}
function joinList(v){return Array.isArray(v)?v.join("，"):"";}
function paramsOf(persona){const p=persona.params||{};return {level:p.level||"",address:p.address||"你",length:p.length||{min:10,max:50},length_drift:p.length_drift||{rate:0,min:2,max:60},emotion:p.emotion||{min:3,max:6},delay_minutes:p.delay_minutes||{min:60,max:180},reply_rate_default:p.reply_rate_default??.7,filler_whitelist:p.filler_whitelist||[],punctuation:p.punctuation||{allow:["，","。"],deny:["～","!","！"]},catchphrases:p.catchphrases||[],never:p.never||[],allowed_categories:p.allowed_categories||[]};}
function integer(el){const n=Number(el.value);return Number.isInteger(n)?n:null;}
async function load(){S.$("grid").innerHTML='<div class="loading"><span class="spin"></span> 加载中…</div>';const d=await S.api("/skills");rows=d.rows||[];if(!rows.length){S.$("grid").innerHTML=S.empty("还没有人设 Skill，点击右上角新建","🎭");return;}S.$("grid").innerHTML=rows.map(s=>{const p=paramsOf(parsePersona(s.persona));return `<div class="entity-card" data-id="${s.id}"><div class="ec-head"><div class="ec-logo">🎭</div><div><div class="ec-name">${S.esc(s.name)}</div><div class="ec-meta">${s.bound_ups?"已绑定："+S.esc(s.bound_ups):"未绑定（请在 UP主管理页绑定）"}</div></div>${S.badge(s.status==="published"?"已发布":"草稿",s.status==="published"?"green":"amber")}</div><div style="font-size:13px;color:var(--text-2)">称呼：${S.esc(p.address)} · 回复率：${S.esc(p.reply_rate_default)}</div><div style="font-size:12.5px;background:#f7f8fb;border-radius:8px;padding:8px 10px;">句长 ${S.esc(p.length.min)}–${S.esc(p.length.max)} · 情绪 ${S.esc(p.emotion.min)}–${S.esc(p.emotion.max)}${Number(p.length_drift.rate)>0?` · 漂移 ${S.esc(p.length_drift.rate)}(${S.esc(p.length_drift.min)}–${S.esc(p.length_drift.max)})`:""}</div><div class="ec-foot"><button class="btn sm" data-act="test">🧪 测试生成</button><button class="btn sm primary" data-act="publish">⬆ 发布版本</button><button class="btn sm" data-act="edit">✏️ 编辑参数包</button><button class="btn sm danger" data-act="del">删除</button></div></div>`;}).join("");}
function editModal(skill){const s=skill||{},p=paramsOf(parsePersona(s.persona));const dlg=S.modal({wide:true,title:s.id?"编辑人设参数包":"新建 Skill",body:`<div class="form-row"><label>Skill 名称 *</label><input id="fName" value="${S.esc(s.name||"")}" placeholder="如：家电老炮·老王"></div><div class="form-row"><label>人设参数包 <span class="muted" style="font-weight:400">（发布后仅同步以下参数）</span></label><div class="form-grid"><div class="form-row"><label>账号等级</label><select id="pLevel">${["","L1","L2","L3","L4","L5"].map(x=>`<option value="${x}" ${x===p.level?"selected":""}>${x||"未设置"}</option>`).join("")}</select></div><div class="form-row"><label>称呼观众</label><input id="pAddress" value="${S.esc(p.address)}"></div><div class="form-row"><label>句长最小/最大</label><div class="form-grid"><input id="pLenMin" type="number" min="1" value="${p.length.min}"><input id="pLenMax" type="number" min="1" value="${p.length.max}"></div></div><div class="form-row"><label>字数漂移 概率(0-1) / 漂移最短 / 漂移最长</label><div class="form-grid"><input id="pDriftRate" type="number" min="0" max="1" step="0.05" value="${p.length_drift.rate}"><input id="pDriftMin" type="number" min="0" value="${p.length_drift.min}"><input id="pDriftMax" type="number" min="1" value="${p.length_drift.max}"></div><div class="sub2">漂移概率：该比例的回复允许突破常规句长，落入“漂移最短–漂移最长”区间（如超短的“是的，不一定”或 50 字长回复）。设为 0 表示关闭。</div></div><div class="form-row"><label>情绪最小/最大 (0-10)</label><div class="form-grid"><input id="pEmotionMin" type="number" min="0" max="10" value="${p.emotion.min}"><input id="pEmotionMax" type="number" min="0" max="10" value="${p.emotion.max}"></div></div><div class="form-row"><label>回复率 (0-1)</label><input id="pRate" type="number" min="0" max="1" step="0.05" value="${p.reply_rate_default}"></div><div class="form-row"><label>延迟分钟 最小/最大</label><div class="form-grid"><input id="pDelayMin" type="number" min="0" value="${p.delay_minutes.min}"><input id="pDelayMax" type="number" min="0" value="${p.delay_minutes.max}"></div></div></div><div class="form-grid"><div class="form-row"><label>可用语气词（逗号分隔）</label><input id="pFillers" value="${S.esc(joinList(p.filler_whitelist))}"></div><div class="form-row"><label>可覆盖品类（逗号分隔）</label><input id="pCategories" value="${S.esc(joinList(p.allowed_categories))}"></div><div class="form-row"><label>允许标点（逗号分隔）</label><input id="pPunctAllow" value="${S.esc(joinList(p.punctuation.allow))}"></div><div class="form-row"><label>禁止标点（逗号分隔）</label><input id="pPunctDeny" value="${S.esc(joinList(p.punctuation.deny))}"></div></div><div class="form-row"><label>口头禅（每行：触发条件 | 话术）</label><textarea id="pCatchphrases" rows="3">${S.esc(p.catchphrases.map(x=>`${x.when||""} | ${x.text||""}`).join("\n"))}</textarea></div><div class="form-row"><label>绝不做什么（每行一条）</label><textarea id="pNever" rows="3">${S.esc(p.never.join("\n"))}</textarea></div></div>`,okText:"保存",onOk:async b=>{const payload={id:s.id||null,name:b.querySelector("#fName").value.trim(),persona:{params:collectParams(b)}};if(!payload.name){S.toast("请填写 Skill 名称","err");return false;}await S.api("/skills/save",{method:"POST",body:payload});S.toast("参数包已保存","ok");load();}});const b=dlg.bodyEl;function collectParams(b){const catchphrases=b.querySelector("#pCatchphrases").value.split("\n").map(x=>x.trim()).filter(Boolean).map(line=>{const[when,...rest]=line.split("|");return{when:when.trim(),text:rest.join("|").trim()};}).filter(x=>x.text);return{level:b.querySelector("#pLevel").value,address:b.querySelector("#pAddress").value.trim(),length:{min:integer(b.querySelector("#pLenMin")),max:integer(b.querySelector("#pLenMax"))},length_drift:{rate:Number(b.querySelector("#pDriftRate").value||0),min:integer(b.querySelector("#pDriftMin")),max:integer(b.querySelector("#pDriftMax"))},emotion:{min:integer(b.querySelector("#pEmotionMin")),max:integer(b.querySelector("#pEmotionMax"))},delay_minutes:{min:integer(b.querySelector("#pDelayMin")),max:integer(b.querySelector("#pDelayMax"))},reply_rate_default:Number(b.querySelector("#pRate").value),filler_whitelist:splitList(b.querySelector("#pFillers").value),punctuation:{allow:splitList(b.querySelector("#pPunctAllow").value),deny:splitList(b.querySelector("#pPunctDeny").value)},catchphrases,never:b.querySelector("#pNever").value.split("\n").map(x=>x.trim()).filter(Boolean),allowed_categories:splitList(b.querySelector("#pCategories").value)};}}
function testModal(s){S.modal({title:`测试生成 · ${s.name}`,body:`<div class="form-row"><label>模拟一条用户评论</label><textarea id="tContent"></textarea></div><div class="form-row" id="tOut" style="display:none"><label>AI 生成回复</label><div class="reply-box" id="tReply"></div></div>`,okText:"🧪 生成",onOk:async b=>{const content=b.querySelector("#tContent").value.trim();if(!content){S.toast("请先输入评论","err");return false;}b.querySelector("#tOut").style.display="block";const res=await S.api("/skills/test",{method:"POST",body:{content,skill_id:s.id}});b.querySelector("#tReply").textContent=res.ok?res.reply:("❌ "+res.error);return false;}});}
S.$("newBtn").onclick=()=>editModal(null);S.$("grid").addEventListener("click",async e=>{const btn=e.target.closest("button[data-act]");if(!btn)return;const s=rows.find(x=>x.id===Number(btn.closest(".entity-card").dataset.id));if(btn.dataset.act==="edit")editModal(s);if(btn.dataset.act==="test")testModal(s);if(btn.dataset.act==="publish")S.confirm(`发布 Skill「${s.name}」为运行版本？`,async()=>{const r=await S.api("/skills/publish",{method:"POST",body:{id:s.id}});S.toast(`已发布 ${r.version}`,"ok");load();});if(btn.dataset.act==="del")S.confirm(`确认删除 Skill「${s.name}」？`,async()=>{await S.api("/skills/delete",{method:"POST",body:{id:s.id}});S.toast("已删除","ok");load();});});load();
</script>
{% endblock %}
