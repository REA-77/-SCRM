{% extends "scrm/base.html" %}
{% block title %}人设 Skill 管理{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h2>🎭 人设 Skill 管理</h2>
    <div class="sub">维护各平台 UP 主的人设风格,AI 推荐回复时自动匹配对应语气与话术</div>
  </div>
  <div class="actions">
    <button class="btn primary" id="newBtn">➕ 新建 Skill</button>
  </div>
</div>

<div id="grid" class="entity-grid"><div class="loading"><span class="spin"></span> 加载中…</div></div>
{% endblock %}

{% block scripts %}
<script>
let rows = [], creators = [];
const PERSONA_SECTIONS = {identity:"一、基础身份",language:"二、语言风格基因",decisions:"三、评论决策启发式",values:"四、价值观与立场",phrases:"五、固定话术库",boundaries:"六、合规与边界",changelog:"七、更新日志"};
function parsePersona(value) { try { return typeof value === "string" ? JSON.parse(value) : (value || {}); } catch (_) { return {}; } }


async function loadCreators() {
  try {
    const d = await S.api("/creators?simple=1");
    creators = d.rows || [];
  } catch (e) { creators = []; }
}

async function load() {
  S.$("grid").innerHTML = '<div class="loading"><span class="spin"></span> 加载中…</div>';
  const d = await S.api("/skills");
  rows = d.rows || [];
  if (!rows.length) {
    S.$("grid").innerHTML = S.empty("还没有人设 Skill,点击右上角新建", "🎭");
    return;
  }
  S.$("grid").innerHTML = rows.map(s => `
    <div class="entity-card" data-id="${s.id}">
      <div class="ec-head">
        <div class="ec-logo">🎭</div>
        <div>
          <div class="ec-name">${S.esc(s.name)}</div>
          <div class="ec-meta">${S.platformTag(s.platform || "通用")}
            ${s.bind_up ? " · 绑定:" + S.esc(s.bind_up) : ""}</div>
        </div>
        ${S.badge(s.status === "ready" ? "可用" : "训练中", s.status === "ready" ? "green" : "amber")}
      </div>
      <div style="font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">
        ${S.esc(s.style || "暂无风格描述")}
      </div>
      <div style="font-size:12.5px;background:#f7f8fb;border-radius:8px;padding:8px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
        <span class="muted">示例:</span>${S.esc(s.example || "-")}
      </div>
      <div class="ec-foot">
        <button class="btn sm" data-act="test">🧪 测试生成</button>
        <button class="btn sm" data-act="edit">✏️ 人设 / 读取评论</button>
        <button class="btn sm danger" data-act="del">删除</button>
      </div>
    </div>`).join("");
}

function editModal(skill) {
  const s = skill || {};
  let persona = parsePersona(s.persona);
  const dlg = S.modal({
    wide: true,
    title: s.id ? "编辑 Skill" : "新建 Skill",
    body: `
      <div class="form-grid">
        <div class="form-row"><label>Skill 名称 *</label>
          <input id="fName" value="${S.esc(s.name || "")}" placeholder="如:家电老炮·老王"></div>
        <div class="form-row"><label>平台</label>
          <select id="fPlatform">
            ${["", "抖音", "视频号", "小红书", "B站", "快手", "微博", "知乎"]
              .map(p => `<option value="${p}" ${p === (s.platform || "") ? "selected" : ""}>${p || "通用"}</option>`).join("")}
          </select></div>
      </div>
      <div class="form-row"><label>绑定 UP 主 <span class="muted" style="font-weight:400;">(与 UP主管理页同步)</span></label>
        <input id="fBind" list="creatorList" value="${S.esc(s.bind_up || "")}" placeholder="从下拉选择 UP主,或输入新昵称">
        <datalist id="creatorList">
          ${creators.map(c => `<option value="${S.esc(c.name)}">${S.esc(c.platform)} · ${S.esc(c.name)}</option>`).join("")}
        </datalist></div>
      <div class="form-row"><label>对标 UP主</label>
        <input id="fBenchmark" list="creatorList" value="${S.esc(persona.benchmark_up || "")}" placeholder="选择用于学习评论风格的 UP主"></div>
      <div class="form-row"><label>基础身份（基础设定，手动填写）</label>
        <textarea id="persona_identity" rows="4">${S.esc(persona.sections?.identity || "")}</textarea></div>
      <div class="form-row"><label>人设风格描述（基础设定，手动填写）</label>
        <textarea id="fStyle">${S.esc(s.style || "")}</textarea></div>
      <div class="form-row">
        <div><button type="button" class="btn" id="readComments">读取对标评论</button>
        <button type="button" class="btn primary" id="analyzeComments">分析生成人设草稿</button></div>
        <p class="sub2">按对标 UP主的关联平台账号昵称精确查询评论人，不读取绑定 UP主评论。基础身份和人设风格描述由你设定，分析不会覆盖。通用会读取所有关联平台，最多分析200条；生成后可修改再保存。</p>
        <div id="sampleInfo" aria-live="polite"></div>
      </div>
      ${Object.entries(PERSONA_SECTIONS).filter(([key]) => key !== "identity").map(([key,label]) => `<div class="form-row"><label>${label}</label><textarea id="persona_${key}" rows="4">${S.esc(persona.sections?.[key] || "")}</textarea></div>`).join("")}
      <div class="form-row"><label>示例回复</label>
        <textarea id="fExample" placeholder="一条符合该人设的典型回复">${S.esc(s.example || "")}</textarea></div>`,
    okText: "保存",
    onOk: async (b) => {
      if (b.querySelector("#analyzeComments").disabled) { S.toast("请等待读取/分析完成", "err"); return false; }
      if (persona.source?.benchmark_up && (persona.source.benchmark_up !== b.querySelector("#fBenchmark").value.trim() || persona.source.platform !== b.querySelector("#fPlatform").value)) {
        S.toast("对标账号或平台已改变，请重新分析以匹配推荐来源", "err"); return false;
      }
      const payload = {
        id: s.id || null,
        name: b.querySelector("#fName").value.trim(),
        platform: b.querySelector("#fPlatform").value,
        bind_up: b.querySelector("#fBind").value.trim(),
        style: b.querySelector("#fStyle").value.trim(),
        example: b.querySelector("#fExample").value.trim(),
        persona: {...persona, benchmark_up:b.querySelector("#fBenchmark").value.trim(), sections: Object.fromEntries(Object.keys(PERSONA_SECTIONS).map(k => [k,b.querySelector("#persona_"+k).value.trim()]))},
      };
      if (!payload.name) { S.toast("请填写 Skill 名称", "err"); return false; }
      await S.api("/skills/save", { method: "POST", body: payload });
      S.toast("Skill 已保存", "ok");
      load();
    },
  });
  const b = dlg.bodyEl;
  function sourcePayload() { return {benchmark_up:b.querySelector("#fBenchmark").value.trim(),platform:b.querySelector("#fPlatform").value, identity:b.querySelector("#persona_identity").value, style:b.querySelector("#fStyle").value}; }
  function showSamples(source) {
    b.querySelector("#sampleInfo").innerHTML = `<p>读取 ${source.sample_count} 条样本。${S.esc(source.note || "")}</p>` +
      (source.accounts || []).map(a => `<div>${S.esc(a.platform)} · ${S.esc(a.nickname)}：匹配 ${a.total} 条</div>`).join("") +
      (source.warnings || []).map(w => `<p>${S.esc(w)}</p>`).join("") +
      `<details><summary>查看分析来源评论</summary>${(source.samples || []).map(r => `<div style="border-bottom:1px solid #eee;padding:8px;"><b>${S.esc(r.platform)} · ${S.esc(r.nickname)}</b> #${r.id}<p>${S.esc(r.content)}</p>${r.parent_content ? `<div class="sub2">父评论：${S.esc(r.parent_content)}</div>` : ""}</div>`).join("")}</details>`;
  }
  if (persona.source) showSamples(persona.source);
  async function runAnalysis(analyze) {
    const buttons = [b.querySelector("#readComments"), b.querySelector("#analyzeComments")];
    const payload = sourcePayload();
    if (!payload.benchmark_up) { S.toast("请先选择对标 UP主", "err"); return; }
    buttons.forEach(x => x.disabled = true);
    b.querySelector("#sampleInfo").textContent = analyze ? "正在读取评论并分析，请稍候…" : "正在读取评论…";
    try {
      const result = await S.api(analyze ? "/skills/analyze-comments" : "/skills/comments", {method:"POST", body:payload});
      if (JSON.stringify(sourcePayload()) !== JSON.stringify(payload)) throw new Error("对标 UP主、平台或基础设定已变更，请重新分析");
      if (analyze) {
        persona = result.persona;
        Object.keys(PERSONA_SECTIONS).filter(k => k !== "identity").forEach(k => b.querySelector("#persona_"+k).value = persona.sections[k] || "");
        b.querySelector("#fExample").value = result.example;
        showSamples(persona.source);
        S.toast("草稿已生成，可编辑后保存", "ok");
      } else showSamples(result);
    } catch (e) { b.querySelector("#sampleInfo").textContent = e.message; S.toast(e.message,"err"); }
    finally { buttons.forEach(x => x.disabled = false); }
  }
  b.querySelector("#readComments").onclick = () => runAnalysis(false);
  b.querySelector("#analyzeComments").onclick = () => runAnalysis(true);
}

function testModal(skill) {
  S.modal({
    title: `测试生成 · ${skill.name}`,
    body: `
      <div class="form-row"><label>模拟一条用户评论</label>
        <textarea id="tContent" placeholder="如:求问 3000 预算买洗烘一体有推荐吗?"></textarea></div>
      <div class="form-row" id="tOut" style="display:none;">
        <label>AI 生成回复</label>
        <div class="reply-box" id="tReply"></div>
      </div>`,
    okText: "🧪 生成",
    onOk: async (b) => {
      const content = b.querySelector("#tContent").value.trim();
      if (!content) { S.toast("请先输入评论", "err"); return false; }
      const out = b.querySelector("#tOut");
      out.style.display = "block";
      b.querySelector("#tReply").innerHTML = '<span class="spin"></span> 正在按人设生成…';
      const res = await S.api("/skills/test", {
        method: "POST",
        body: { content, style: skill.style, bind_up: skill.bind_up || skill.name, persona: parsePersona(skill.persona) },
      });
      b.querySelector("#tReply").textContent = res.ok ? res.reply : ("❌ " + res.error);
      return false; // 保持弹窗,允许继续测试
    },
  });
}

S.$("newBtn").onclick = () => editModal(null);
S.$("grid").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = Number(btn.closest(".entity-card").dataset.id);
  const s = rows.find(x => x.id === id);
  if (btn.dataset.act === "edit") editModal(s);
  if (btn.dataset.act === "test") testModal(s);
  if (btn.dataset.act === "del") {
    S.confirm(`确认删除 Skill「${s.name}」?`, async () => {
      await S.api("/skills/delete", { method: "POST", body: { id } });
      S.toast("已删除", "ok"); load();
    });
  }
});

loadCreators();
load();
</script>
{% endblock %}
