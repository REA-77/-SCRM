{% extends "scrm/base.html" %}
{% block title %}线索列表{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h2>📋 线索列表</h2>
    <div class="sub">购买意向线索查询、分配与状态管理</div>
  </div>
  <div class="actions">
    <button class="btn" id="remindBtn">🔔 批量提醒</button>
    <button class="btn primary" id="assignBtn">👤 批量分配</button>
  </div>
</div>

<div class="filter-bar">
  <select id="fStatus">
    <option value="">全部状态</option>
    <option value="new">待联系</option>
    <option value="contacted">已联系</option>
    <option value="following">跟进中</option>
    <option value="feedback">客户反馈</option>
    <option value="won">已成交</option>
    <option value="lost">已流失</option>
  </select>
  <select id="fOwner"><option value="">全部负责人</option></select>
  <select id="fPlatform">
    <option value="">全部平台</option>
    <option>抖音</option><option>视频号</option><option>小红书</option>
    <option>B站</option><option>快手</option><option>微博</option>
  </select>
  <select id="fOverdue">
    <option value="">全部时效</option>
    <option value="1">仅超时</option>
  </select>
  <input id="fQ" placeholder="搜索来源评论内容">
  <button class="btn primary" id="searchBtn">🔍 筛选</button>
  <button class="btn" id="resetBtn">重置</button>
</div>

<div class="card" style="padding:0;">
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th style="width:34px;"><input type="checkbox" id="chkAll"></th>
        <th style="width:70px;">平台</th>
        <th>来源评论 / 意向</th>
        <th style="width:150px;">所属内容 / UP主</th>
        <th style="width:84px;">状态</th>
        <th style="width:84px;">负责人</th>
        <th style="width:120px;">最后跟进</th>
        <th style="width:130px;">跟进截止</th>
        <th style="width:360px;">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager" style="padding:12px 14px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let page = 1, size = 20, rows = [], team = [];
const SCOLOR = { new: "gray", contacted: "primary", following: "teal",
  feedback: "amber", won: "green", lost: "gray" };

async function load() {
  const p = new URLSearchParams({ page, size });
  const v = id => S.$(id).value;
  if (v("fStatus")) p.set("status", v("fStatus"));
  if (v("fOwner")) p.set("owner", v("fOwner"));
  if (v("fPlatform")) p.set("platform", v("fPlatform"));
  if (v("fOverdue")) p.set("overdue", "1");
  if (v("fQ")) p.set("q", v("fQ"));
  S.$("tbody").innerHTML = `<tr><td colspan="9" class="loading"><span class="spin"></span> 加载中…</td></tr>`;
  try {
    const d = await S.api("/leads?" + p.toString());
    rows = d.rows; team = d.team || [];
    if (!S.$("fOwner").dataset.inited) {
      S.$("fOwner").innerHTML = '<option value="">全部负责人</option>' +
        team.map(t => `<option>${t}</option>`).join("");
      S.$("fOwner").dataset.inited = "1";
    }
    if (!rows.length) {
      S.$("tbody").innerHTML = `<tr><td colspan="9">${S.empty("没有符合条件的线索", "🧭")}</td></tr>`;
    } else {
      S.$("tbody").innerHTML = rows.map((r, i) => `
        <tr class="${r.overdue ? "row-overdue" : ""}">
          <td><input type="checkbox" class="chk" data-id="${r.id}"></td>
          <td>${S.platformTag(r.platform)}</td>
          <td class="cell-content">
            <a href="/scrm/leads/${r.id}"><div class="clamp">${S.esc(r.content)}</div></a>
            <div class="sub2">${S.esc(r.nickname || "匿名")} · ${S.ago(r.ctime)}
              ${r.reply ? " · 💡" + S.esc(String(r.reply).slice(0, 30)) : ""}</div>
          </td>
          <td class="cell-content">
            <div class="clamp muted" style="font-size:12.5px;">${S.esc(r.video_title || r.content_id || "-")}</div>
            <div class="sub2">${S.esc(r.upname || "-")}</div>
          </td>
          <td>${S.badge(r.status ? (d.status_map[r.status] || r.status) : "-", SCOLOR[r.status] || "gray", true)}</td>
          <td>${r.owner ? S.esc(r.owner) : S.badge("待分配", "red")}</td>
          <td class="nowrap muted">${r.last_follow_ts ? S.ago(r.last_follow_ts) : "未跟进"}</td>
          <td class="nowrap" style="${r.overdue ? "color:var(--red);font-weight:600;" : ""}">
            ${r.due_ts ? S.fmtDate(r.due_ts) + (r.overdue ? " ⚠" : "") : "—"}
          </td>
          <td class="nowrap">
            ${S.commentActionButtons(i)}
            <a class="btn sm" href="/scrm/leads/${r.id}">详情</a>
            <a class="btn sm primary" href="/scrm/leads/${r.id}/workflow">跟进</a>
          </td>
        </tr>`).join("");
    }
    S.bindCommentActionButtons(S.$("tbody"), rows, () => load());
    S.pager(S.$("pager"), d.total, page, size, x => { page = x; load(); });
  } catch (e) {
    S.$("tbody").innerHTML = `<tr><td colspan="9" style="color:#dc2626;padding:20px;">${S.esc(e.message)}</td></tr>`;
  }
}

function ids() { return S.$$(".chk:checked").map(c => Number(c.dataset.id)); }

S.$("chkAll").onchange = e => S.$$(".chk").forEach(c => c.checked = e.target.checked);
S.$("searchBtn").onclick = () => { page = 1; load(); };
S.$("resetBtn").onclick = () => {
  ["fStatus","fOwner","fPlatform","fOverdue","fQ"].forEach(id => S.$(id).value = "");
  page = 1; load();
};
S.$("fQ").addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; load(); } });

S.$("assignBtn").onclick = () => {
  const selected = ids();
  if (!selected.length) return S.toast("请先勾选线索", "err");
  S.modal({
    title: `批量分配 ${selected.length} 条线索`,
    body: `<div class="form-row"><label>分配给</label>
      <select id="mOwner">${team.map(t => `<option>${t}</option>`).join("")}
        <option value="">__置为待分配__</option></select></div>`,
    okText: "确认分配",
    onOk: async (b) => {
      const owner = b.querySelector("#mOwner").value || null;
      let n = 0;
      for (const id of selected) {
        await S.api(`/leads/${id}/update`, { method: "POST", body: { owner } });
        n++;
      }
      S.toast(`已分配 ${n} 条线索给 ${owner || "待分配"}`, "ok");
      load();
    },
  });
};

S.$("remindBtn").onclick = () => {
  const selected = ids();
  if (!selected.length) return S.toast("请先勾选线索", "err");
  S.toast(`🔔 已向 ${selected.length} 条线索的负责人发送飞书提醒`, "ok");
};

// 支持 URL 预选状态
const st = S.qsGet("status");
if (st) S.$("fStatus").value = st;
load();
</script>
{% endblock %}
