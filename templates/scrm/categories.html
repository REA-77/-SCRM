{% extends "scrm/base.html" %}
{% block title %}品类管理{% endblock %}
{% block content %}
<div class="page-head"><div><h2>🏷️ 品类管理</h2><div class="sub">维护一级分类和对应的产品类型</div></div><button class="btn primary" id="addRootBtn">➕ 新增一级分类</button></div>
<div class="card" style="padding:0"><div class="table-wrap"><table class="data"><thead><tr><th>一级分类</th><th>产品类型</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody></table></div></div>
{% endblock %}
{% block scripts %}<script>
let rows=[];
function render(){const roots=rows.filter(r=>!r.parent_id),children=rows.filter(r=>r.parent_id),html=[];const add=(r,product)=>`<tr><td>${product?'':S.esc(r.name)}</td><td>${product?S.esc(r.name):'<span class="muted">—</span>'}</td><td>${S.badge(r.status==='active'?'启用':'停用',r.status==='active'?'green':'gray')}</td><td>${S.fmtTs(r.updated_ts)}</td><td><button class="btn small edit" data-id="${r.id}">编辑</button>${!product?` <button class="btn small add-child" data-id="${r.id}">新增产品类型</button>`:''}</td></tr>`;roots.forEach(root=>{html.push(add(root,false));children.filter(c=>Number(c.parent_id)===Number(root.id)).forEach(c=>html.push(add(c,true)))});S.$('tbody').innerHTML=html.join('')||'<tr><td colspan="5" class="muted">暂无分类</td></tr>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openModal(rows.find(r=>Number(r.id)===Number(b.dataset.id))));document.querySelectorAll('.add-child').forEach(b=>b.onclick=()=>openModal(null,Number(b.dataset.id)))}
function openModal(row,parentId){const isChild=!!(row?.parent_id||parentId),roots=rows.filter(r=>!r.parent_id),options='<option value="">（一级分类）</option>'+roots.map(r=>`<option value="${r.id}" ${Number(row?.parent_id||parentId)===Number(r.id)?'selected':''}>${S.esc(r.name)}</option>`).join('');S.modal({title:row?'编辑分类':(isChild?'新增产品类型':'新增一级分类'),body:`<div class="form-row"><label>${isChild?'产品类型':'一级分类名称'}</label><input id="mName" value="${S.esc(row?.name||'')}"></div><div class="form-row"><label>所属一级分类</label><select id="mParent">${options}</select></div>`,okText:'保存',onOk:async b=>{const name=b.querySelector('#mName').value.trim(),parent=b.querySelector('#mParent').value;if(!name)throw Error('分类名称必填');if(!parent&&row?.parent_id)throw Error('产品类型必须选择一级分类');await S.api('/categories/save',{method:'POST',body:{id:row?.id,name,parent_id:parent||null}});S.toast('已保存','ok');load()}})}
async function load(){const d=await S.api('/categories');rows=d.rows||[];render()} S.$('addRootBtn').onclick=()=>openModal(null,null);load();
</script>{% endblock %}
